<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>
<style>
  body{
    background-image: url("WhatsApp Image 2024-04-22 at 1.21.44 PM.jpeg");
    width: 100%;
    background-color: #0c111b;
    position: relative;
    font-family: sans-serif,roboto;
  }

  .container {
    float: left;
    width: 350px;
    margin: auto;
    margin-top: 10px;
    margin-left: 40px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f0f0f0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-weight: bold;
  }

  input[type="text"] {
    width: 90%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  button {
    display: block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body background="background: back.jpg;">

<div class="container">
  <h2>Payment Form</h2>
  <form action="select_plan.html" method="POST" onsubmit="return validateForm()">
    <div class="form-group">
      <label for="card_number">Card Number</label>
      <input type="text" id="card_number" name="card_number" placeholder="1234 5678 9012 3456" >
    </div>
    <div class="form-group">
      <label for="expiry">Expiry Date</label>
      <input type="text" id="expiry" name="expiry" placeholder="MM/YY" >
    </div>
    <div class="form-group">
      <label for="cvv">CVV</label>
      <input type="text" id="cvv" name="cvv" placeholder="123" >
    </div>
    <div class="form-group">
      <label for="name">Cardholder Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" >
    </div>
    
    <h1>or</h1>
    <div class="form-group">
      <label for="upi">UPI ID</label>
      <input type="text" id="upi" name="upi" placeholder="example@upi">
    </div>
    <button type="submit">Select Plan</button>
  </form>
</div>

<script>
function validateForm() {
  var cardNumber = document.getElementById("card_number").value;
  var expiry = document.getElementById("expiry").value;
  var cvv = document.getElementById("cvv").value;
  var upi = document.getElementById("upi").value;

  if (!/^\d{16}$/.test(cardNumber)) {
    alert("Please enter a 16-digit card number.");
    return false;
  }

  if (!/^\d{3}$/.test(cvv)) {
    alert("Please enter a 3-digit CVV.");
    return false;
  }

  var expiryPattern = /^(0[1-9]|1[0-2])\/\d{2}$/;
  if (!expiryPattern.test(expiry)) {
    alert("Please enter expiry date in the format MM/YY.");
    return false;
  }

  if (upi && !/^[\w.-]+@[\w.-]+$/.test(upi)) {
    alert("Please enter a valid UPI ID.");
    return false;
  }
  window.open("home.html");
  return true;
}

</script>

</body>
</html>
